[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-synthesized-diff-auditor"
version = "0.1.0"
description = "Abstract Syntax Tree semantic validator verifying that agent-generated git patches do not alter unmentioned functions or signatures"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-synthesized-diff-auditor = "agent_synthesized_diff_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_synthesized_diff_auditor*"]
